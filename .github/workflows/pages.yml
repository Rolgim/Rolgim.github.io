name: Site (GitHub Pages)
# Publie la page d'accueil sur GitHub Pages, à la racine de https://rolgim.github.io/.
# Réglage nécessaire une fois : Settings → Pages → Source : « GitHub Actions ».
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'favicon.svg', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Dossier du site
        run: |
          mkdir -p _site
          cp index.html favicon.svg .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: dep
        uses: actions/deploy-pages@v4
